components:
  schemas:
    ErrorResponse:
      type: "object"
      properties:
        status:
          type: "integer"
          format: "int32"
        message:
          type: "string"
      required:
      - "message"
    Object:
      type: "object"
      properties: {}
    AccountUpdateRequest:
      type: "object"
      properties:
        name:
          type: "string"
        type:
          type: "string"
          enum:
          - "CURRENT"
          - "CHECKING"
          - "SAVING"
          - "CREDIT_CARD"
          - "INVESTMENT"
          - "CASH"
        currency:
          type: "string"
          enum:
          - "AOA"
          - "USD"
          - "EUR"
        institution:
          type: "string"
        description:
          type: "string"
    BigDecimal:
      type: "object"
      properties: {}
    AccountBalanceRequest:
      type: "object"
      properties:
        balance:
          $ref: "#/components/schemas/BigDecimal"
      required:
      - "balance"
    TransactionRequest:
      type: "object"
      properties:
        amount:
          $ref: "#/components/schemas/BigDecimal"
        categoryId:
          type: "string"
          format: "uuid"
        type:
          type: "string"
          enum:
          - "INCOME"
          - "EXPENSE"
        note:
          type: "string"
      required:
      - "amount"
      - "categoryId"
      - "type"
    Category:
      type: "object"
      properties:
        categoryId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
      required:
      - "name"
    LoginRequest:
      type: "object"
      properties:
        username:
          type: "string"
        password:
          type: "string"
      required:
      - "username"
      - "password"
    User:
      type: "object"
      properties:
        userId:
          type: "string"
          format: "uuid"
        username:
          type: "string"
        password:
          type: "string"
        email:
          type: "string"
      required:
      - "username"
      - "password"
    AccountRequest:
      type: "object"
      properties:
        name:
          type: "string"
        balance:
          $ref: "#/components/schemas/BigDecimal"
        type:
          type: "string"
          enum:
          - "CURRENT"
          - "CHECKING"
          - "SAVING"
          - "CREDIT_CARD"
          - "INVESTMENT"
          - "CASH"
        currency:
          type: "string"
          enum:
          - "AOA"
          - "USD"
          - "EUR"
        institution:
          type: "string"
        description:
          type: "string"
      required:
      - "name"
      - "balance"
      - "type"
      - "currency"
    PasswordUpdate:
      type: "object"
      properties:
        oldPassword:
          type: "string"
        newPassword:
          type: "string"
      required:
      - "oldPassword"
      - "newPassword"